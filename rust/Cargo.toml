[package]
name = "lport"
version = "0.1.0"
edition = "2024"
description = "Linux 端口转发管理工具（Rust 版）"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "macros", "sync", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
