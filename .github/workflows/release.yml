# 交叉编译 lport（Go 版 lport-* 与 Rust 版 lport-rs-*）并发布到 GitHub Releases。
#
# 触发方式:
#   - 推送 v 开头的 tag（如 v1.0.0）：编译全部架构并创建 Release；tag 含 "-"（如 v1.0.0-rc1）时标记为预发布
#   - 手动运行（Actions 页面 Run workflow）：只编译并上传为构建产物，不创建 Release
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先跑完整的单元测试与集成测试，通过后才编译发布
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe 需要完整历史与 tag

      - uses: actions/setup-go@v6
        with:
          # 发布用最新稳定版编译（含安全修复）；go.mod 中的版本只是最低要求，由 CI 验证
          go-version: stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 确定版本号
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      # 构建前端 → go test → 交叉编译 amd64 / arm64 / armv7 / armv6 / 386，产物位于 release/
      - name: 编译
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,arm-unknown-linux-musleabihf,i686-unknown-linux-musl

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # cargo test → 用 zig 交叉编译 musl 静态二进制，产物 release/lport-rs-* 与 sha256sums-rs.txt
      - name: 编译 Rust 版
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-rust.sh

      - name: 检查产物
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          sha256sum -c sha256sums.txt
          sha256sum -c sha256sums-rs.txt
          for f in lport-*.tar.gz; do
            tar -tzf "$f" | grep -q '/lport$' || { echo "$f 中缺少 lport"; exit 1; }
          done
          # 在 runner 上实际运行 amd64 版本做冒烟测试（lport-* 通配也会匹配 lport-rs-*，须分开取）
          tar -xzf "lport-${VERSION}-linux-amd64.tar.gz" -O --wildcards '*/lport' > /tmp/lport
          chmod +x /tmp/lport && /tmp/lport version && /tmp/lport detect
          tar -xzf "lport-rs-${VERSION}-linux-amd64.tar.gz" -O --wildcards '*/lport' > /tmp/lport-rs
          chmod +x /tmp/lport-rs && /tmp/lport-rs version && /tmp/lport-rs detect
          file /tmp/lport-rs | grep -q 'statically linked' || { echo "lport-rs 不是静态链接"; exit 1; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: lport-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "lport $TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重新运行时覆盖已有产物
            gh release upload "$TAG" release/*.tar.gz release/sha256sums.txt release/sha256sums-rs.txt --clobber
          else
            gh release create "$TAG" release/*.tar.gz release/sha256sums.txt release/sha256sums-rs.txt "${flags[@]}"
          fi
