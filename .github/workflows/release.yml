# 交叉编译 lport 并发布到 GitHub Releases。
#
# 触发方式:
#   - 推送 v 开头的 tag（如 v1.0.0）：编译全部架构并创建 Release；tag 含 "-"（如 v1.0.0-rc1）时标记为预发布
#   - 手动运行（Actions 页面 Run workflow）：只编译并上传为构建产物，不创建 Release
#
# 不重复运行测试：要求该 commit 已在 main 上且 main 的 CI（ci.yml）已通过；CI 仍在运行时等待其结束。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 确认 commit 已在 main 上
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA 不在 main 分支上，请先合并到 main 再打 tag"; exit 1; }

      # 同时推送 main 与 tag 时 CI 可能刚开始，最多等 2 分钟出现，再等待其结束
      - name: 等待 main 上的 CI 通过
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 24); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$id" ]] && break
            sleep 5
          done
          [[ -n "$id" ]] || { echo "::error::没有找到 $GITHUB_SHA 在 main 上的 CI 运行"; exit 1; }
          echo "CI 运行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null \
            || { echo "::error::main 上的 CI 未通过，不发布"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe 需要完整历史与 tag

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,arm-unknown-linux-musleabihf,i686-unknown-linux-musl

      # 直接安装官方 zig 包（mlugg/setup-zig 仍运行在已废弃的 Node.js 20 上），固定版本保证构建可复现
      - name: 安装 zig
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - name: 确定版本号
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      # 构建前端 → cargo test → 用 zig 交叉编译 amd64 / arm64 / armv7 / armv6 / 386 的 musl 静态二进制，产物位于 release/
      - name: 编译
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build.sh

      - name: 检查产物
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          sha256sum -c sha256sums.txt
          for f in lport-*.tar.gz; do
            tar -tzf "$f" | grep -q '/lport$' || { echo "$f 中缺少 lport"; exit 1; }
          done
          # 在 runner 上实际运行 amd64 版本做冒烟测试
          tar -xzf "lport-${VERSION}-linux-amd64.tar.gz" -O --wildcards '*/lport' > /tmp/lport
          chmod +x /tmp/lport
          file /tmp/lport | grep -q 'statically linked' || { echo "lport 不是静态链接"; exit 1; }
          [[ "$(/tmp/lport version)" == "$VERSION" ]] || { echo "版本号不符: $(/tmp/lport version)"; exit 1; }
          /tmp/lport detect
          # 嵌入的是真实前端，而不是未构建时的占位页
          printf 'listen: 127.0.0.1:18999\nbackend: builtin\nadmin: {password: smoke-test}\n' > /tmp/lport.yaml
          /tmp/lport serve --config /tmp/lport.yaml & pid=$!
          for i in $(seq 50); do curl -sf -o /tmp/index.html http://127.0.0.1:18999/ && break; sleep 0.1; done
          kill "$pid"
          grep -q 'assets/index-' /tmp/index.html || { echo "前端未嵌入"; cat /tmp/index.html; exit 1; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: lport-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--title "lport $TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重新运行时覆盖已有产物
            gh release upload "$TAG" release/*.tar.gz release/sha256sums.txt --clobber
          else
            gh release create "$TAG" release/*.tar.gz release/sha256sums.txt "${flags[@]}"
          fi
