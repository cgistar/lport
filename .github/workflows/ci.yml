# 持续集成：单元测试 + 真实内核上的集成测试（root、网络命名空间、nftables/iptables/realm/内置转发），
# 以及 Rust 版（rust/）的格式、lint 与单元测试。
# 推送 main、提交 PR 时运行；发布流程（release.yml）也会先调用本工作流。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # go:embed 需要 web/dist，同时完成前端类型检查
      - name: 构建前端
        run: cd web && npm ci && npm run build

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal web/*.go)
          [[ -z "$out" ]] || { echo "以下文件需要 gofmt:"; echo "$out"; exit 1; }

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: 单元测试
        run: go test -race -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 安装转发工具
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iptables
          curl -fsSL https://github.com/zhboner/realm/releases/latest/download/realm-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin realm

      - name: 环境信息
        run: |
          uname -r
          nft --version
          iptables --version
          realm -v
          sudo iptables -S FORWARD

      # 以普通用户编译测试程序，再以 root 运行（测试需要创建网络命名空间、修改 nftables/iptables）
      - name: 编译集成测试
        run: |
          go test -c -tags integration -o "$RUNNER_TEMP/backend.test" ./internal/backend
          go test -c -tags integration -o "$RUNNER_TEMP/manager.test" ./internal/manager

      # 显式指定 shell: bash 才会启用 pipefail，否则 tee 会吞掉测试失败的退出码
      - name: 后端集成测试
        working-directory: internal/backend
        shell: bash
        run: sudo "$RUNNER_TEMP/backend.test" -test.run Integration -test.v -test.count=1 | tee "$RUNNER_TEMP/backend.out"

      - name: 连通性检测集成测试
        working-directory: internal/manager
        shell: bash
        run: sudo "$RUNNER_TEMP/manager.test" -test.run Integration -test.v -test.count=1 | tee "$RUNNER_TEMP/manager.out"

      # 跳过不等于通过：任何集成测试被跳过（如缺少工具、非 root）都视为失败；结果汇总为注解，便于在运行页面查看
      - name: 检查测试未被跳过
        run: |
          for f in backend manager; do
            out="$RUNNER_TEMP/$f.out"
            if grep -q -- '--- SKIP' "$out"; then
              echo "::error title=$f 集成测试被跳过::$(grep -- '--- SKIP' "$out" | sed 's/^ *//' | paste -sd ';')"
              exit 1
            fi
            summary=$(grep -E -- '--- (PASS|FAIL)|模式' "$out" | sed -E 's/^ *//; s/ *integration_test.go:[0-9]+: //' | paste -sd ';')
            echo "::notice title=$f 集成测试::$summary"
          done

      - name: 失败时输出防火墙状态
        if: failure()
        run: |
          sudo nft list ruleset || true
          sudo iptables -S || true
          sudo iptables -t nat -S || true
