# 持续集成：格式 / lint / 单元测试、多架构交叉编译，以及真实内核上的集成测试
# （root、网络命名空间、nftables/iptables/realm/内置转发）。
# 推送 main、提交 PR 时运行；发布流程（release.yml）也会先调用本工作流。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端在编译时嵌入二进制，同时完成前端类型检查
      - name: 构建前端
        run: cd web && npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --locked

  # 发布前确认全部目标架构都能编译（发布流程会再完整编译一次）
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,arm-unknown-linux-musleabihf,i686-unknown-linux-musl

      # 直接安装官方 zig 包（mlugg/setup-zig 仍运行在已废弃的 Node.js 20 上），固定版本保证构建可复现
      - name: 安装 zig
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2

      - name: 交叉编译
        run: |
          for t in aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf arm-unknown-linux-musleabihf i686-unknown-linux-musl; do
            cargo zigbuild --locked --release --target "$t"
          done

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 显式指定 shell: bash 才会启用 pipefail，否则 tee 会吞掉测试失败的退出码
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装转发工具
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iptables
          curl -fsSL https://github.com/zhboner/realm/releases/latest/download/realm-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin realm

      - name: 环境信息
        run: |
          uname -r
          nft --version
          iptables --version
          realm -v
          sudo iptables -S FORWARD

      # 以普通用户编译测试程序，再以 root 运行（测试需要创建网络命名空间、修改 nftables/iptables）
      - name: 编译集成测试
        run: |
          bin=$(cargo test --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable')
          echo "TEST_BIN=$bin" >> "$GITHUB_ENV"

      - name: 集成测试
        run: sudo "$TEST_BIN" --ignored integration --test-threads=1 --nocapture | tee "$RUNNER_TEMP/it.out"

      # 跳过不等于通过：任何集成测试被跳过（如缺少工具、非 root）都视为失败；结果汇总为注解，便于在运行页面查看
      - name: 检查测试未被跳过
        run: |
          out="$RUNNER_TEMP/it.out"
          if grep -q -- '--- SKIP' "$out"; then
            echo "::error title=集成测试被跳过::$(grep -- '--- SKIP' "$out" | paste -sd ';')"
            exit 1
          fi
          echo "::notice title=集成测试::$(grep -E -- '--- PASS|nftables 模式' "$out" | sed 's/^ *//' | paste -sd ';')"

      - name: 失败时输出防火墙状态
        if: failure()
        run: |
          sudo nft list ruleset || true
          sudo iptables -S || true
          sudo iptables -t nat -S || true
